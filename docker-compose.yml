version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: wuziqi-postgres
    environment:
      POSTGRES_USER: wuziqi
      POSTGRES_PASSWORD: wuziqi
      POSTGRES_DB: wuziqi
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7-alpine
    container_name: wuziqi-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

volumes:
  pg_data:
  redis_data:
